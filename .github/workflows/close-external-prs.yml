name: Close external pull requests

# Crucible CE does not accept outside code contributions. A pull request from
# anyone without write access to this repository gets a comment and is closed.
#
# Pull requests from a branch in this repository are never closed: only people
# with write access can push one. For fork pull requests the script checks the
# author's actual permission. The payload's author_association is not enough
# on its own, because members whose org membership is private can show up as
# CONTRIBUTOR there.
#
# pull_request_target runs in the base repository's context, so the token can
# comment on and close fork pull requests. This workflow never checks out or
# runs code from the pull request. Keep it that way.

on:
  pull_request_target:
    types: [opened, reopened]

permissions: {}

jobs:
  close:
    if: >-
      github.event.pull_request.head.repo.full_name != github.repository &&
      !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
      github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      # Pinned to a full commit SHA (the comment names the release).
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            const username = context.payload.pull_request.user.login;
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username });
              if (["admin", "maintain", "write"].includes(data.permission)) {
                core.info(`${username} has ${data.permission} access. Leaving the pull request open.`);
                return;
              }
            } catch (err) {
              core.info(`Permission check for ${username} failed (${err.status ?? err.message}). Treating as external.`);
            }
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: number,
              body: "Crucible CE does not accept outside code contributions. Please open an issue to report a bug or request a feature.",
            });
            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: number,
              state: "closed",
            });
