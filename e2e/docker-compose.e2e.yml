# End-to-end test overlay for the Playwright suite (e2e/).
#
#   docker compose -p ce-e2e -f docker-compose.yml -f e2e/docker-compose.e2e.yml \
#     --env-file e2e/.state/e2e.env up -d --build --wait
#
# Normally you don't run this by hand: `npm run test:e2e` (e2e/global-setup.ts)
# writes e2e/.state/e2e.env with fresh secrets and an Ed25519 export key, brings
# the stack up under its own project name, and tears it down (`down -v`) at the
# end. TEST ONLY: plain-http webhook to a private address, SMTP without TLS.
services:
  app:
    # Own tag, so an e2e build never re-tags the self-host image.
    image: crucible-ce-e2e:local
    ports: !override
      - "127.0.0.1:${CRUCIBLE_PORT:-3200}:3000"
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_REQUIRE_TLS: "false"
      SMTP_FROM: "Crucible E2E <crucible@e2e.test>"
      DELIVERY_WEBHOOK_URL: http://webhook:8080/hook
      DELIVERY_WEBHOOK_SECRET: ${DELIVERY_WEBHOOK_SECRET:?generated by e2e/stack.ts}
      DELIVERY_WEBHOOK_ALLOW_PRIVATE: "true"
      EXPORT_SIGNING_PRIVATE_KEY: ${EXPORT_SIGNING_PRIVATE_KEY:?generated by e2e/stack.ts}
    depends_on:
      mailpit:
        condition: service_started
      webhook:
        condition: service_healthy

  mailpit:
    # Pinned by digest (axllent/mailpit:v1.27). SMTP :1025, API/UI :8025.
    image: axllent/mailpit@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:${E2E_MAILPIT_PORT:-8226}:8025"

  webhook:
    # Tiny signed-webhook receiver (e2e/webhook-receiver.mjs): verifies
    # X-Crucible-Signature and exposes what it received on GET /received.
    image: node:24-bookworm-slim@sha256:d6aa754f16b3197301076f047b5def2f02ea1dbbc2ca920407d46d7ec7f87b20
    command: ["node", "/srv/webhook-receiver.mjs"]
    environment:
      WEBHOOK_SECRET: ${DELIVERY_WEBHOOK_SECRET}
      PORT: "8080"
    volumes:
      - ./e2e/webhook-receiver.mjs:/srv/webhook-receiver.mjs:ro
    ports:
      - "127.0.0.1:${E2E_WEBHOOK_PORT:-3299}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 15
